# Example only: adapt domain, paths and certificates. Enable rewrite, ssl, headers.
<VirtualHost *:80>
    ServerName tour.example.com
    Redirect permanent / https://tour.example.com/
</VirtualHost>
<VirtualHost *:443>
    ServerName tour.example.com
    DocumentRoot /var/www/inborgo/public
    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/tour.example.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/tour.example.com/privkey.pem
    <Directory /var/www/inborgo/public>
        Require all granted
        AllowOverride All
        Options -Indexes
    </Directory>
    <Directory /var/www/inborgo/public/uploads>
        AllowOverride All
        Options -Indexes -ExecCGI
        <FilesMatch "\.(php[0-9]?|phtml|phar|cgi|pl|html|svg|js)$">
            Require all denied
        </FilesMatch>
    </Directory>
    # Configure your hosting provider's PHP 8 handler / PHP-FPM here.
    # Example (enable proxy_fcgi and adjust the socket):
    <FilesMatch "\.php$">
        SetHandler "proxy:unix:/run/php/php8.3-fpm.sock|fcgi://localhost/"
    </FilesMatch>
    ErrorLog ${APACHE_LOG_DIR}/inborgo-error.log
    CustomLog ${APACHE_LOG_DIR}/inborgo-access.log combined
</VirtualHost>
